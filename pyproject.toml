[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditenv"
version = "1.0.0"
description = "Reproducible RL environment for training AI financial auditors (synthetic AR books, hidden booking errors, evidence-based reward)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []  # standard library only

[project.scripts]
auditenv = "auditenv.cli:main"

[tool.setuptools]
packages = ["auditenv", "auditenv.policies"]
